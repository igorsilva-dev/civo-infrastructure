name: Terraform Deployment

on:
  push:
    branches:
      - main

# Applies merged changes to lon1/dev, but only while the cluster is up. The
# cluster is brought up on demand (cluster-up.yaml) and torn down nightly
# (cluster-down.yaml); a merge while it is down must not create it, or a
# docs-only merge at 22:00 would bill until the next night's teardown. The
# change lands on the next Cluster Up, which applies main.

# Serialize state operations across deployment, destroy, cluster-up, and cluster-down.
concurrency:
  group: civo-lon1-dev-state
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Terraform changes
    runs-on: ubuntu-latest
    env:
      CIVO_ACCESS_KEY: ${{ secrets.CIVO_ACCESS_KEY }}
      CIVO_SECRET_KEY: ${{ secrets.CIVO_SECRET_KEY }}
      CIVO_TOKEN: ${{ secrets.CIVO_TOKEN }}
      TF_VAR_doppler_token: ${{ secrets.DOPPLER_TOKEN }}

    permissions:
      id-token: write
      contents: read
      pull-requests: read
      checks: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            region: lon1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install asdf
        uses: asdf-vm/actions/setup@v3
        with:
          asdf_branch: v0.15.0

      - name: Install OpenTofu with asdf
        run: |
          asdf plugin add opentofu
          asdf install opentofu

      - name: Install Terragrunt with asdf
        run: |
          asdf plugin add terragrunt
          asdf install terragrunt

      - name: Terragrunt init
        working-directory: environments/${{ matrix.region }}/${{ matrix.env }}
        run: terragrunt init

      - name: Check the cluster is up
        id: cluster
        working-directory: environments/${{ matrix.region }}/${{ matrix.env }}
        run: |
          if terragrunt state list | grep -qx 'module.kubernetes.civo_kubernetes_cluster.cluster'; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cluster is down; skipping apply. The change lands on the next Cluster Up."
          fi

      - name: Terragrunt apply
        if: steps.cluster.outputs.up == 'true'
        working-directory: environments/${{ matrix.region }}/${{ matrix.env }}
        run: terragrunt apply -auto-approve
