name: Cluster Down (nightly)

# Tears the lon1/dev cluster down every night from 18:07 Madrid time, so it only
# bills for the hours it is worked on. Bring it back with cluster-up.yaml. The
# cluster is reproducible from git (Argo CD reconciles everything from
# k8s-gitops, ADR 0003), so a destroy loses nothing.
#
# GitHub cron is UTC-only and Madrid moves between UTC+2 (CEST) and UTC+1
# (CET). Each slot is scheduled at both UTC hours, and the gate below keeps the
# one that matches Madrid's offset on that date. The gate keys on which cron
# fired, not the wall clock, so a run GitHub starts late still tears down
# instead of being skipped.
#
# Two slots, both off the top of the hour (GitHub delays and drops scheduled
# runs most at :00; the 2026-10-26 teardown started 3.5 hours late and the
# 19:00 UTC run never appeared at all):
#   - 18:07 Madrid, the teardown.
#   - 20:37 Madrid, a backstop in case the first run was dropped. Destroy on an
#     already-empty state is a no-op, so it needs no "is it still up" check, and
#     the concurrency group serializes it behind a late first run.
#
# Scheduled early on purpose. Moving off :00 didn't remove the delay: on
# 2026-10-27 every slot started 3 to 4 hours late (the 21:07 teardown at 00:44),
# so the schedule assumes that delay and lands the destroy around 21:00-22:00.
# The cost: on a day GitHub runs on time, the cluster goes at 18:07, and an
# evening session starts with Cluster Up again.

on:
  schedule:
    - cron: "7 16 * * *" # 18:07 CEST (summer)
    - cron: "7 17 * * *" # 18:07 CET (winter)
    - cron: "37 18 * * *" # 20:37 CEST (summer), backstop
    - cron: "37 19 * * *" # 20:37 CET (winter), backstop
  workflow_dispatch:

concurrency:
  group: civo-lon1-dev-state
  cancel-in-progress: false

jobs:
  down:
    name: Destroy lon1/dev
    runs-on: ubuntu-latest
    env:
      CIVO_ACCESS_KEY: ${{ secrets.CIVO_ACCESS_KEY }}
      CIVO_SECRET_KEY: ${{ secrets.CIVO_SECRET_KEY }}
      CIVO_TOKEN: ${{ secrets.CIVO_TOKEN }}
      TF_VAR_doppler_token: ${{ secrets.DOPPLER_TOKEN }}
    permissions:
      contents: read
    steps:
      - name: Gate on Madrid time
        id: gate
        run: |
          offset="$(TZ=Europe/Madrid date +%z)"
          case "${{ github.event_name }}|${{ github.event.schedule }}|$offset" in
            workflow_dispatch*) run=true ;;
            "schedule|7 16 * * *|+0200" | "schedule|37 18 * * *|+0200") run=true ;;
            "schedule|7 17 * * *|+0100" | "schedule|37 19 * * *|+0100") run=true ;;
            *) run=false ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Madrid offset $offset, trigger '${{ github.event.schedule }}': run=$run"

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Install asdf
        if: steps.gate.outputs.run == 'true'
        uses: asdf-vm/actions/setup@v3
        with:
          asdf_branch: v0.15.0

      - name: Install OpenTofu with asdf
        if: steps.gate.outputs.run == 'true'
        run: |
          asdf plugin add opentofu
          asdf install opentofu

      - name: Install Terragrunt with asdf
        if: steps.gate.outputs.run == 'true'
        run: |
          asdf plugin add terragrunt
          asdf install terragrunt

      - name: Terragrunt init
        if: steps.gate.outputs.run == 'true'
        working-directory: environments/lon1/dev
        run: terragrunt init

      # Deleting the Civo cluster takes every in-cluster object with it, so
      # there is no point deleting them one by one through the Kubernetes API
      # first. That path is also what hung the 2026-07-17 teardown: the
      # sandbox namespace sat in Terminating until the 5-minute timeout.
      # Dropping the kubernetes/kubectl/helm resources from state leaves a
      # destroy of only the Civo cluster, network, and firewall.
      - name: Forget in-cluster resources
        if: steps.gate.outputs.run == 'true'
        working-directory: environments/lon1/dev
        run: |
          addrs=()
          while IFS= read -r addr; do
            [ -n "$addr" ] && addrs+=("$addr")
          done < <(terragrunt state list | grep -E '(^|\.)(kubernetes_[a-z0-9_]+|kubectl_manifest|helm_release)\.' || true)
          if [ "${#addrs[@]}" -eq 0 ]; then
            echo "No in-cluster resources in state."
          else
            terragrunt state rm "${addrs[@]}"
          fi

      - name: Terragrunt destroy
        if: steps.gate.outputs.run == 'true'
        working-directory: environments/lon1/dev
        run: terragrunt destroy -auto-approve

      # After the destroy, not before: a running operator would re-register its devices with its
      # OAuth client. Never fails the teardown; a Tailscale API problem only leaves stale devices,
      # which Cluster Up removes before the next bring-up.
      - name: Remove the cluster's Tailscale devices
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TS_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
        run: .github/scripts/tailscale-cleanup.sh
